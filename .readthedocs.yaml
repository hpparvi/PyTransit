# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    - pandoc  # nbsphinx converts the notebooks' Markdown cells with pandoc
  jobs:
    # Read the Docs clones shallowly, but setuptools-scm needs the tags to work out the version.
    post_checkout:
      - git fetch --unshallow --tags || true

python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/source/conf.py
